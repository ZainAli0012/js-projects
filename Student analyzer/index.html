<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main-content">
        <h1 id="Text">Student Analyzer</h1>
        <div id="container">
            <div id="search-box">
                <label for="search-input" id="search">Search</label>
                <input type="text" id="input" placeholder="type to search...">
            </div>
            <button id="add-btn">+ Add</button>
        </div>
        <table id="table">
            <thead>
                <tr id="heading-row">
                    <th class="name">Name</th>
                    <th class="score">Score</th>
                    <th class="status">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr class="table-row">
                    <td class="name">Zain</td>
                    <td class="number">67%</td>
                    <td class="pass">Pass</td>
                </tr>
                <tr class="table-row">
                    <td class="name">Husnain</td>
                    <td class="number">78%</td>
                    <td class="pass">Pass</td>
                </tr>
                <tr class="table-row">
                    <td class="name">Ali</td>
                    <td class="number">98%</td>
                    <td class="review">Review</td>
                </tr>
                  <tr class="table-row">
                    <td class="name">Ahmed</td>
                    <td class="number">98%</td>
                    <td class="review">Review</td>
                </tr>
                

            </tbody>
        </table>
    </div>

    <script src="task.js"></script>
</body>

</html>
