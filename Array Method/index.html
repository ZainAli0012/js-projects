<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Array Methods Playground</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Array Methods Playground</h2>


        <!-- Array Input -->

        <div class="form">

            <label>
                <h5>Array values</h5>
            </label>

            <input type="text" id="Input" placeholder="10,20,30,40">

        </div>


        <!-- Method + Value + Button -->

        <div class="row">

            <div class="form">

                <label>
                    <p>Method</p>
                </label>

                <input type="text" id="method" value="slice">

            </div>


            <div class="form">

                <label>
                    <p>Value</p>
                </label>

                <input type="text" id="userValue" placeholder="Enter value">

            </div>


            <button id="btn">Run Method</button>

        </div>


        <!-- Output -->

        <div class="output">

            <p id="pages">Original: []</p>

            <p id="value" class="result">
                Result: []
            </p>

        </div>

    </div>


    <script src="task.js"></script>

</body>

</html>
