        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Smart Result Calculator</title>

            <link rel="stylesheet" href="style.css">
        </head>
        <body>

            <div id="container">

                <h1>Student Result Calculator</h1>

                <div id="main">

                
                    <div id="subjects">

                        <label>English</label>
                        <input type="number" id="english" placeholder="">

                        <label>Math</label>
                        <input type="number" id="math" placeholder="">

                        <label>Physics</label>
                        <input type="number" id="physics" placeholder="">

                        <label>Urdu</label>
                        <input type="number" id="urdu" placeholder="">

                        <label>Chemistry</label>
                        <input type="number" id="chemistry" placeholder="">
                        
                    </div>

                    <div id="result-box">

                        <p id="result">RESULT</p>

                        <h2 id="percentage">0%</h2>

                        <p id="grade"></p>

                        

                        <button id="btn"onclick="calculate()">Calculate</button>
                        <button id="btn1"onclick="resetBtn()">Reset</button>

                    </div>

                </div>

            </div>

            

            <script src="task.js"></script>

        </body>
        </html>
