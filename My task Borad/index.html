<!DOCTYPE html>
    <html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Task Board</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div id="container">

        <h1 id="heading">My Task Board</h1>


        <div id="new-task">

            <label for="finish">New task</label>


            <div id="task">

                <input type="text" id="finish" placeholder="Finish JS assignment">

                <button id="add-btn">
                    Add Task
                </button>

            </div>

        </div>

        <div id="list">


            <!-- Task 1 -->

            <div id="task-1">

                <div id="title-1">
                    Build calculator
                </div>


                <div id="actions-1">

                    <button id="done-1">
                        Done
                    </button>

                    <button id="copy-1">
                        Copy
                    </button>

                    <button id="delete-1">
                        Delete
                    </button>

                </div>

            </div>


            <!-- Task 2 -->

            <div id="task-2">

                <div id="title-2">
                    Practice arrays
                </div>


                <div id="actions-2">

                    <button id="done-2">
                        Done
                    </button>

                    <button id="copy-2">
                        Copy
                    </button>

                    <button id="delete-2">
                        Delete
                    </button>

                </div>

            </div>


            <!-- Task 3 -->

            <div id="task-3">

                <div id="title-3">
                    DOM challenge
                </div>


                <div id="actions-3">

                    <button id="done-3">
                        Done
                    </button>

                    <button id="copy-3">
                        Copy
                    </button>

                    <button id="delete-3">
                        Delete
                    </button>

                </div>

            </div>


        </div>

    </div>


    <script src="task.js"></script>

</body>

</html>
