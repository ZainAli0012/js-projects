<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="container">

        <h2 id="heading">Tech Store</h2>

        <!-- New Product -->
        <div id="add-product">

            <input type="text" id="product-name" placeholder="Product name">

            <input type="number" id="product-price" placeholder="Price">

            <button id="add-btn">Add Product</button>

        </div>


        <div id="store">

            <div id="product">

                <div id="product1">

                    <div id="product-box1"></div>

                    <h4 id="product-name1">Headphones</h4>

                    <p id="product-price1">AED 180</p>

                </div>


                <div id="product2">

                    <div id="product-box2"></div>

                    <h4 id="product-name2">Keyboard</h4>

                    <p id="product-price2">AED 120</p>

                </div>

            </div>


            <div id="card">

                <h4 id="title">YOUR CART</h4>

                <p id="items">2 items</p>

                <span id="total">TOTAL</span>

                <h2 id="price">AED 300</h2>

            </div>

        </div>

    </div>


    <script src="task.js"></script>

</body>

</html>
